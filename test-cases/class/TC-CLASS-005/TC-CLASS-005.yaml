# TC-CLASS-005 删除班级（存在学生）
# class 模块 - 测试用例

id: TC-CLASS-005
title: 删除班级（存在学生）
version: 1.0
priority: P1
module: class
tags: [crud, delete, constraint, related-data]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于班级管理页面
  - 存在编号为 "C001" 的班级，且该班级下存在学生

steps:
  - action: 在班级列表中找到编号为 "C001" 的班级
    expected: 班级记录显示在列表中，班级人数大于0
  - action: 点击"删除"按钮
    expected: 显示删除确认对话框，提示该班级下存在学生
  - action: 点击"确认"按钮
    expected: 显示提示信息，不建议直接删除

expected_results:
  - 系统检测到班级存在学生
  - 提示用户不建议直接删除班级

assertions:
  - type: ui
    description: 显示关联数据提示
    validate:
      - 提示"该班级下存在学生，不建议删除"