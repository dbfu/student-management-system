# TC-CLASS-008 分配班主任
# class 模块 - 测试用例

id: TC-CLASS-008
title: 分配班主任
version: 1.0
priority: P1
module: class
tags: [assign, teacher, relation]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于班级管理页面
  - 存在编号为 "C001" 的班级
  - 存在教师工号为 "T001" 的教师

steps:
  - action: 在班级列表中找到编号为 "C001" 的班级
    expected: 班级记录显示在列表中
  - action: 点击"编辑"按钮
    expected: 显示编辑班级表单
  - action: 在班主任字段选择教师 "T001"
    expected: 班主任选择框显示教师姓名
  - action: 点击"保存"按钮
    expected: 显示修改成功提示，班级列表显示班主任信息

expected_results:
  - 班主任成功分配
  - 班级信息中显示班主任姓名
  - 教师信息中显示担任班主任的班级

assertions:
  - type: ui
    description: 显示分配结果
    validate:
      - 班级列表中班主任字段显示教师姓名