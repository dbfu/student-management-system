# TC-SCORE-006 查询成绩（按条件筛选）
# score 模块 - 测试用例

id: TC-SCORE-006
title: 查询成绩（按条件筛选）
version: 1.0
priority: P1
module: score
tags: [query, filter, search]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于成绩管理页面
  - 系统中存在多条成绩记录

test_scenarios:
  - name: 按学生学号搜索
    steps:
      - action: 输入学生学号或姓名
        expected: 搜索框显示内容
      - action: 点击搜索
        expected: 成绩列表只显示该学生的成绩

  - name: 按课程筛选
    steps:
      - action: 选择课程筛选条件
        expected: 筛选框显示课程名称
      - action: 应用筛选
        expected: 成绩列表只显示该课程的成绩

  - name: 按班级筛选
    steps:
      - action: 选择班级筛选条件
        expected: 筛选框显示班级名称
      - action: 应用筛选
        expected: 成绩列表只显示该班级学生的成绩

  - name: 按学期筛选
    steps:
      - action: 选择学期筛选条件
        expected: 筛选框显示学期
      - action: 应用筛选
        expected: 成绩列表只显示该学期的成绩

expected_results:
  - 系统正确响应筛选条件
  - 成绩列表显示符合筛选条件的记录

assertions:
  - type: ui
    description: 筛选结果正确显示
    validate:
      - 按学生搜索结果只包含该学生的成绩
      - 按课程筛选结果只包含该课程的成绩