# TC-TEACHER-005 删除教师信息（无绑定课程）
# teacher 模块 - 测试用例

id: TC-TEACHER-005
title: 删除教师信息（无绑定课程）
version: 1.0
priority: P0
module: teacher
tags: [crud, delete, confirmation]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于教师管理页面
  - 存在工号为 "T001" 的教师记录，且该教师未绑定课程

steps:
  - action: 在教师列表中找到工号为 "T001" 的教师
    expected: 教师记录显示在列表中
  - action: 点击"删除"按钮
    expected: 显示删除确认对话框
  - action: 点击"确认"按钮
    expected: 教师信息删除成功，教师列表中不再显示该记录

expected_results:
  - 删除操作需要二次确认
  - 确认删除后教师记录被删除

assertions:
  - type: ui
    description: 显示确认对话框
    validate:
      - 点击删除按钮时显示确认对话框
  - type: data
    description: 数据正确删除
    validate:
      - 确认删除后数据库中无该教师记录