# TC-STUDENT-002 新增学生信息（学号重复）
# student 模块 - 测试用例

id: TC-STUDENT-002
title: 新增学生信息（学号重复）
version: 1.0
priority: P0
module: student
tags: [crud, create, validation, unique]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于学生管理页面
  - 学号 "2024001" 在系统中已存在

steps:
  - action: 点击"新增学生"按钮
    expected: 显示新增学生表单
  - action: 输入学号 "2024001"
    expected: 学号输入框显示 "2024001"
  - action: 输入姓名 "李四"
    expected: 姓名输入框显示 "李四"
  - action: 填写其他必填字段（性别、出生日期等）
    expected: 各字段正确填写
  - action: 点击"保存"按钮
    expected: 显示错误提示"学号已存在"或类似信息

expected_results:
  - 系统检测到学号重复
  - 显示明确的错误提示信息
  - 学生信息未保存
  - 用户可以修改学号后重新提交

assertions:
  - type: ui
    description: 显示学号重复提示
    validate:
      - 页面显示"学号已存在"或"学号不能重复"错误提示
      - 学生信息未添加到列表
  - type: data
    description: 数据未保存
    validate:
      - 数据库中仍只有一条学号为"2024001"的记录（原记录）