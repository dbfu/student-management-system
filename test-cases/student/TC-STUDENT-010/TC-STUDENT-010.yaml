# TC-STUDENT-010 导出学生信息
# student 模块 - 测试用例

id: TC-STUDENT-010
title: 导出学生信息
version: 1.0
priority: P2
module: student
tags: [export, excel]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于学生管理页面
  - 系统中存在学生记录

test_scenarios:
  - name: 导出全部学生
    steps:
      - action: 点击"导出"按钮
        expected: 显示导出选项（格式选择：Excel/PDF）
      - action: 选择导出格式为 Excel
        expected: 格式选择为 Excel
      - action: 确认导出
        expected: 系统生成Excel文件，浏览器下载文件

  - name: 导出筛选结果
    steps:
      - action: 设置筛选条件（如学院=计算机学院）
        expected: 学生列表显示筛选结果
      - action: 点击"导出"按钮
        expected: 显示导出选项
      - action: 确认导出
        expected: 系统导出符合筛选条件的学生数据

expected_results:
  - 成功生成导出文件
  - 导出文件内容准确完整
  - 导出文件格式正确
  - 文件可正常打开

assertions:
  - type: file
    description: 导出文件内容正确
    validate:
      - 导出文件包含所有学生信息字段
      - 数据与系统显示一致
      - Excel文件格式正确可打开