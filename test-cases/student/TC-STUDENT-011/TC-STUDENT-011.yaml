# TC-STUDENT-011 Excel批量导入学生信息
# student 模块 - 测试用例

id: TC-STUDENT-011
title: Excel批量导入学生信息
version: 1.0
priority: P2
module: student
tags: [import, excel, batch]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于学生管理页面
  - 已准备符合导入模板格式的Excel文件

test_scenarios:
  - name: 正常导入
    steps:
      - action: 点击"批量导入"按钮
        expected: 显示导入文件选择对话框
      - action: 选择符合格式的Excel文件
        expected: 文件名显示在导入界面
      - action: 点击"开始导入"按钮
        expected: 系统开始导入，显示导入进度
      - action: 导入完成
        expected: 显示导入成功提示，显示导入数量，学生列表包含新导入的学生

  - name: 导入格式错误文件
    steps:
      - action: 点击"批量导入"按钮
        expected: 显示导入对话框
      - action: 选择格式不符的Excel文件
        expected: 文件名显示
      - action: 点击"开始导入"
        expected: 显示导入失败原因，提示哪些行/字段有问题

  - name: 导入含重复学号的文件
    steps:
      - action: 选择含已存在学号的Excel文件
        expected: 文件上传成功
      - action: 开始导入
        expected: 显示导入结果，提示重复学号未能导入，其他记录成功导入

expected_results:
  - 成功导入符合格式的学生数据
  - 导入失败时显示明确的错误原因
  - 系统保持稳定不卡死
  - 导入结果准确记录

assertions:
  - type: data
    description: 导入数据正确
    validate:
      - 成功导入的学生数据与Excel内容一致
      - 学号重复的记录未导入
  - type: ui
    description: 显示导入结果
    validate:
      - 显示成功导入数量
      - 显示失败记录及原因