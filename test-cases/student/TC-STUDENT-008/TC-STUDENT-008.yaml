# TC-STUDENT-008 查询学生信息（按条件筛选）
# student 模块 - 测试用例

id: TC-STUDENT-008
title: 查询学生信息（按条件筛选）
version: 1.0
priority: P0
module: student
tags: [query, filter, search]

created_at: 2026-05-27
updated_at: 2026-05-27
status: active

history:
  - version: 1.0
    date: 2026-05-27
    author: 测试
    change: 初始创建

preconditions:
  - 用户已登录系统
  - 当前位于学生管理页面
  - 系统中存在多个学生记录（不同学院、专业、班级）

test_scenarios:
  - name: 按学号搜索
    steps:
      - action: 在搜索框输入学号 "2024001"
        expected: 搜索框显示 "2024001"
      - action: 点击搜索按钮或按回车
        expected: 学生列表只显示学号包含"2024001"的学生

  - name: 按姓名搜索
    steps:
      - action: 在搜索框输入姓名 "张三"
        expected: 搜索框显示 "张三"
      - action: 点击搜索按钮
        expected: 学生列表只显示姓名包含"张三"的学生

  - name: 按学院筛选
    steps:
      - action: 在学院筛选框选择 "计算机学院"
        expected: 筛选框显示 "计算机学院"
      - action: 应用筛选
        expected: 学生列表只显示所属学院为"计算机学院"的学生

  - name: 按班级筛选
    steps:
      - action: 在班级筛选框选择 "软工2401班"
        expected: 筛选框显示 "软工2401班"
      - action: 应用筛选
        expected: 学生列表只显示所属班级为"软工2401班"的学生

  - name: 组合筛选
    steps:
      - action: 选择学院 "计算机学院" 和专业 "软件工程"
        expected: 筛选条件正确显示
      - action: 应用筛选
        expected: 学生列表显示同时满足两个条件的学生

expected_results:
  - 系统正确响应筛选条件
  - 学生列表显示符合筛选条件的记录
  - 筛选结果准确无误
  - 可清除筛选条件恢复全部列表

assertions:
  - type: ui
    description: 筛选结果正确显示
    validate:
      - 按学号搜索结果只包含匹配学号的记录
      - 按学院筛选结果只包含对应学院的记录
  - type: behavior
    description: 筛选可清除
    validate:
      - 清除筛选条件后显示全部学生