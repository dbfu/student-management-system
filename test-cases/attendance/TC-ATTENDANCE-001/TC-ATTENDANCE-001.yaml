preconditions:
  - 用户已登录系统
  - 当前位于考勤管理页面
  - 存在学号为 "2024001" 的学生
  - 存在课程编号为 "CS001" 的课程
  - 当前日期为2026-05-27，该学生该课程当天无考勤记录

steps:
  - action: 选择课程 "CS001"
    expected: 课程选择框显示 "软件工程导论"
  - action: 选择班级
    expected: 班级选择框显示班级名称
  - action: 选择考勤日期 "2026-05-26"
    expected: 日期选择器显示 "2026-05-26"
  - action: 系统显示该班级学生列表
    expected: 学生列表显示，包含学号、姓名
  - action: 为学号 "2024001" 的学生选择考勤状态 "正常"
    expected: 考勤状态选择框显示 "正常"
  - action: 输入备注信息（可选）
    expected: 备注输入框显示内容
  - action: 点击"提交"按钮
    expected: 考勤记录保存成功，显示成功提示

expected_results:
  - 考勤记录成功保存
  - 考勤列表显示新增的考勤记录

assertions:
  - type: ui
    description: 显示考勤记录
    validate:
      - 考勤列表显示该学生的考勤记录
      - 考勤状态显示正确