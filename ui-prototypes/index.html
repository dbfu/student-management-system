<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统 - UI原型导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Sans', sans-serif;
        }
        .card {
            transition: all 200ms ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 122, 255, 0.15);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary/5 to-primary/10">
    <div class="max-w-4xl mx-auto py-12 px-4">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl shadow-lg mb-6">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">学生管理系统</h1>
            <p class="text-gray-500">MVP版本 UI原型设计</p>
            <div class="mt-4 inline-flex items-center px-4 py-2 bg-green-100 text-green-700 rounded-full">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                5个页面已完成
            </div>
        </div>

        <!-- Design Info -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8">
            <h2 class="font-semibold text-gray-800 mb-4">设计规范</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                <div class="p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 mb-1">主色调</p>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-primary rounded mr-2"></div>
                        <span class="text-gray-800">#007AFF</span>
                    </div>
                </div>
                <div class="p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 mb-1">字体</p>
                    <span class="text-gray-800">Fira Sans</span>
                </div>
                <div class="p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 mb-1">风格</p>
                    <span class="text-gray-800">现代简洁</span>
                </div>
                <div class="p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 mb-1">响应式</p>
                    <span class="text-gray-800">✓ 支持</span>
                </div>
            </div>
        </div>

        <!-- Pages Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Login -->
            <a href="login.html" class="card bg-white rounded-2xl shadow-sm p-6 cursor-pointer">
                <div class="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a4 4 0 11-8 0 4 4 0 018 0zM4 14a6 6 0 0112 0v3H4v-3z"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-800 mb-2">登录页</h3>
                <p class="text-sm text-gray-500">用户名密码登录、密码显示切换、登录验证</p>
                <div class="mt-4 flex items-center text-primary">
                    <span class="text-sm">查看原型</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
            </a>

            <!-- Dashboard -->
            <a href="dashboard.html" class="card bg-white rounded-2xl shadow-sm p-6 cursor-pointer">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-800 mb-2">首页仪表盘</h3>
                <p class="text-sm text-gray-500">统计数据卡片、数据图表、快速操作、最新动态</p>
                <div class="mt-4 flex items-center text-green-600">
                    <span class="text-sm">查看原型</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
            </a>

            <!-- Students -->
            <a href="students.html" class="card bg-white rounded-2xl shadow-sm p-6 cursor-pointer">
                <div class="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-800 mb-2">学生管理</h3>
                <p class="text-sm text-gray-500">搜索筛选、列表表格、新增编辑删除、导入导出、分页</p>
                <div class="mt-4 flex items-center text-primary">
                    <span class="text-sm">查看原型</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
            </a>

            <!-- Teachers -->
            <a href="teachers.html" class="card bg-white rounded-2xl shadow-sm p-6 cursor-pointer">
                <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-800 mb-2">教师管理</h3>
                <p class="text-sm text-gray-500">搜索筛选、列表表格、新增编辑删除、分配课程</p>
                <div class="mt-4 flex items-center text-orange-600">
                    <span class="text-sm">查看原型</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
            </a>

            <!-- Classes -->
            <a href="classes.html" class="card bg-white rounded-2xl shadow-sm p-6 cursor-pointer">
                <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-800 mb-2">班级管理</h3>
                <p class="text-sm text-gray-500">搜索筛选、列表表格、新增编辑删除、查看学生</p>
                <div class="mt-4 flex items-center text-purple-600">
                    <span class="text-sm">查看原型</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
            </a>
        </div>

        <!-- Footer -->
        <div class="text-center mt-12 text-sm text-gray-500">
            <p>学生管理系统 MVP版本 UI原型 | 2026年5月</p>
        </div>
    </div>
</body>
</html>
